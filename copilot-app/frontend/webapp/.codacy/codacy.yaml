runtimes:
    - node@18
tools:
    - eslint@8

# Exclude common build/vendor/generated folders so the analyzer focuses on app source
# (helps avoid noisy SARIF results and runtime-install attempts for vendor artifacts)
excludePaths:
    - "**/node_modules/**"
    - "**/.vite/**"
    - "dist/**"
    - "build/**"
    - "vendor/**"
    - "artifacts/**"
    - "**/generated/**"
    - "**/coverage/**"
