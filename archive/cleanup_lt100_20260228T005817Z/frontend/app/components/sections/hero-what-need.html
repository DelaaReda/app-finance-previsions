            <span class="need-desc">Deep dive sur n'importe quelle action</span>

        <button class="need-btn" onclick="quickNeed('forecast')">

            <span class="need-title">Voir prévisions</span>

            <span class="need-title">Dernières news</span>

        <button class="need-btn" onclick="quickNeed('ask')">
