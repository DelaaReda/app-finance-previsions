<div id="notificationDrawer" class="notification-drawer" role="dialog" aria-label="Notifications">
    <div class="drawer-header">
        <h2>Notifications</h2>
        <button class="close-btn" onclick="closeNotifications()" aria-label="Close">✕</button>
    </div>
    <div class="drawer-content">
        <div class="notification-item high">
            <span class="notif-icon">🎯</span>
            <div class="notif-content">
                <h3>NVDA Breakout Detected</h3>
                <p>Strong momentum signal with 92% confidence</p>
                <span class="notif-time">2h ago</span>
            </div>
            <button class="mark-read" onclick="markAsRead(this)" aria-label="Mark as read">✓</button>
        </div>
        <div class="notification-item medium">
            <span class="notif-icon">✅</span>
            <div class="notif-content">
                <h3>Portfolio Health Improved</h3>
                <p>Your health score increased to 83%</p>
                <span class="notif-time">4h ago</span>
            </div>
            <button class="mark-read" onclick="markAsRead(this)" aria-label="Mark as read">✓</button>
        </div>
        <div class="notification-item low read">
            <span class="notif-icon">📊</span>
            <div class="notif-content">
                <h3>Weekly Report Ready</h3>
                <p>Your performance summary is available</p>
                <span class="notif-time">1d ago</span>
            </div>
            <button class="mark-read" onclick="markAsRead(this)" aria-label="Mark as read">✓</button>
        </div>
    </div>
    <div class="drawer-footer">
        <button class="mark-all-btn" onclick="markAllRead()">Mark all as read</button>
    </div>
</div>
