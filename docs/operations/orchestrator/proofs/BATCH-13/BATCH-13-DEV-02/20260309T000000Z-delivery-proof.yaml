## API Endpoints

### Log Decision
```
POST /api/copilot/decision-journal/log
{
  "question": "Should I buy AAPL?",
  "answer": "Yes, strong earnings expected",
  "verdict": "buy",
  "confidence": 0.85,
  "tickers": ["AAPL"],
  "horizon": "1d",
  "reasoning": "Strong Q1 expected",
  "risk_level": "medium",
  "model": "gpt-4"
}
```

### Record Outcome Feedback
```
POST /api/copilot/decision-journal/outcomes
{
  "decision_id": "abc123",
  "horizon": "1d",
  "status": "resolved",
  "actual_return": 0.05,
  "predicted_return": 0.03,
  "notes": "Beat expectations"
}
```

### Get Decision Journal
```
GET /api/copilot/decision-journal?limit=50&tickers=AAPL&horizon=1d&verdict=buy
```

### Get Outcome Feedback
```
GET /api/copilot/decision-journal/outcomes?decision_id=abc123&status=resolved
```

### Get Metrics
```
GET /api/copilot/decision-journal/metrics
# Returns hit_rate, calibration_error per horizon (1d/1w/1m)
```

## Storage

- Decisions: `runtime/data/copilot_decision_journal/entries/{decision_id}.json` (immutable)
- Outcomes: `judge_decision_outcome_feedback_records` (append-only JSON store)

## Schema

Decision entry:
```json
{
  "decision_id": "sha1 hash",
  "recorded_at": "ISO timestamp",
  "question": "...",
  "answer": "...",
  "verdict": "buy|sell|hold",
  "confidence": 0.0-1.0,
  "horizon": "1d|1w|1m",
  "tickers": ["AAPL"],
  "reasoning": "...",
  "risk_level": "low|medium|high|critical",
  "sources": [...],
  "model": "...",
  "outcome": {
    "status": "pending|in_progress|resolved",
    "checkpoints": {"1d": null, "1w": null, "1m": null}
  }
}
```

