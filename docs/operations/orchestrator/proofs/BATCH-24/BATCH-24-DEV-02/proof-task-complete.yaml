## Urgency Tier Features Already Implemented

### 1. Backend Field Preservation (apiConnector.js)
```javascript
function transformAlert(payload) {
  return {
    id: ...,
    priority_band: String(raw.priority_band || raw.priorityBand || '').toLowerCase(),
    priority_rank: normalizeNumber(raw.priority_rank ?? raw.priorityRank, 0),
    priority_score: normalizeNumber(raw.priority_score ?? raw.priorityScore, 0),
    suppression: raw.suppression && typeof raw.suppression === 'object' ? raw.suppression : {},
    signals: raw.signals && typeof raw.signals === 'object' ? raw.signals : {}
  };
}
```

### 2. Alert Queue Metadata (apiConnector.js)
```javascript
window.alertTimelineMeta = {
  generatedAt: String(alertsPayload?.generatedAt || ''),
  suppressedCount: normalizeNumber(alertsPayload?.suppressedCount, 0),
  topPriorityBand: String(alertsPayload?.queue?.top_priority_band || '').toLowerCase(),
  priorityBands: extractObject(alertsPayload?.stats, ['priority_bands']) || {},
  suppressionReasons: extractObject(alertsPayload?.stats, ['suppression_reasons']) || {},
  suppressionWindowMinutes: normalizeNumber(
    alertsPayload?.pipeline?.suppression_window_minutes, 0
  ),
};
```

### 3. UI Urgency Visualization (app.js)
- **Filter buttons**: All | Urgent | Action | Monitor
- **Queue chips**: Show counts per priority band (Urgent X, Action X, Monitor X, Background X)
- **Suppression context**: "Held X", "15m window", duplicate reason chips
- **Alert sorting**: By `priorityBandRank` → `priorityRank` → `confidence` → `timestamp`
- **Per-alert labels**: "Urgent queue", "Action queue", "Monitor queue" visible in each row
- **Repeat indicator**: "repeat Xx" shown for suppressed duplicates that were released

### 4. User-Visible Urgency Tiers
| Priority Band | Filter Label | Chip Color | Sort Priority |
|--------------|--------------|------------|---------------|
| `urgent` | Urgent | high (red) | 1 (top) |
| `high` | Action | high (red) | 2 |
| `medium` | Monitor | medium (yellow) | 3 |
| `low` | Background | low (gray) | 4 |

