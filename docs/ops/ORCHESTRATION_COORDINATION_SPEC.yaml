spec:
  id: "openclaw-parallel-orchestration-coordination"
  version: "1.1.1"
  status: "active"
  language: "fr"
  generated_at_utc: "2026-02-26T00:00:00Z"
  updated_at_utc: "2026-02-26T23:10:00Z"
  change_log:
    - date_utc: "2026-02-26"
      version: "1.1.1"
      changes:
        - "Ajoute workboard_role_has_in_progress au runtime context obligatoire."
        - "Documente le profil codex delivery (search web + sandbox full-access + approval never)."
        - "Ajoute la matrice tooling OpenClaw (web/browser/skills) pour accelerer dev et QA."
    - date_utc: "2026-02-26"
      version: "1.1.0"
      changes:
        - "Active dependency guard sur complete: impossible de DONE si deps non DONE."
        - "Active proof manifest task-level auto-genere et validation structure minimale."
        - "Ajoute source-of-truth stamps queue/workboard dans les contrats role."
        - "Formalise GATE-03 en contrat machine-readable (review_ref/review_verdict)."
        - "Ajoute enforcement SLA handoff exploitable via commande dediee."
        - "Ajoute scripts utilitaires circuit-breaker et export KPI JSONL."
    - date_utc: "2026-02-26"
      version: "1.0.1"
      changes:
        - "Clarifie le schema EVIDENCE (format kv) et ajoute un niveau d'enforcement progressif."
        - "Ajoute des invariants de coordination (queue/workboard/handoff) pour reduire la derive."
        - "Ajoute des gates qualite livraison relies aux scripts de validation existants."
  owners:
    operational_owner: "main"
    runtime_owner: "adminapp-codex"
    delivery_governance_owner: "admin-agents"
    quality_safety_owner: "clawsentinel"
  intent:
    - "Definir la reference complete pour l'orchestration multi-agents parallele."
    - "Formaliser les mecanismes anti-conflits, preuves de livraison et coordination inter-roles."
    - "Permettre l'introduction de nouvelles specs sans casser la cadence de livraison."

