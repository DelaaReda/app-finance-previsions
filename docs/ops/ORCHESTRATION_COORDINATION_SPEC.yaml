execution_model:
  tick_lifecycle:
    - step: "scheduler_wakeup"
      MUST: "le cron declenche un run isole par role"
    - step: "role_run_lock"
      MUST: "acquerir lock fichier par role; si lock occupe, sortir contrat RUN_LOCK_BUSY"
      implementation_ref: "scripts/cron_tmux_role_runner.sh:343"
    - step: "context_hydration"
      MUST: "charger queue/workboard/memoire role/self_last_contract/peer_contracts/admin chat"
      implementation_ref: "scripts/cron_tmux_role_runner.sh:1376"
    - step: "execution"
      MUST: "executer prompt role et normaliser en contrat 8 cles"
    - step: "runtime_truth_reconcile"
      MUST: "corriger les sorties stale/generiques selon etat runtime reel"
    - step: "quality_gates"
      MUST: "appliquer gates NO_DELTA, delivery contract, ready/dispatch coherence"
    - step: "persist_contract"
      MUST: "ecrire le dernier contrat role dans role-state/*.last_contract"
      implementation_ref: "scripts/cron_tmux_role_runner.sh:338"

  runtime_context_fields:
    REQUIRED:
      - "now_iso"
      - "queue_states"
      - "queue_has_ready"
      - "ready_items"
      - "ready_next_actions"
      - "blocked_items"
      - "workstate_hint"
      - "parallel_hint"
      - "workboard_role_has_work"
      - "workboard_role_has_in_progress"
      - "agent_memory"
      - "self_last_contract"
      - "peer_contracts"
      - "workboard_context"
      - "team_chat_tail"
      - "team_iteration_tail"
      - "trace_tail"

contracts:
  role_contract:
    description: "contrat de sortie obligatoire pour chaque role"
    keys_order:
      - STATUS
      - DELTA
      - EVIDENCE
      - RISKS
      - NEXT
      - VERDICT
      - BLOCKER_ID
      - NEXT_ACTION_UNIQUE
    REQUIRED:
      STATUS:
        allowed_examples:
          - "IN_PROGRESS"
          - "EN_ATTENTE_SANS_READY_REPRISE_CONTRAT"
          - "BLOCKED"
      DELTA:
        rule: "NO_DELTA autorise seulement quand queue_has_ready=0"
      EVIDENCE:
        description: "champ de preuve compact (kv) pour limiter les sorties narratives non verifiables"
        format: "paires key=value separees par ';' (case-insensitive)"
        pair_separator: ";"
        kv_separator: "="
        case_insensitive: true
        MUST_contain:
          - "task_update=<claim|complete|handoff|blocked|analysis_only|none_no_ready>"
          - "lock_check=ok"
          - "queue_version=<checksum_or_version>"
          - "workboard_version=<checksum_or_version>"
        enforcement_progressif:
          baseline_must:
            - "task_update"
            - "lock_check"
            - "role artifact marker (<role>_artifact=...)"
            - "queue_version"
            - "workboard_version"
          phase_1_should_when_has_work:
            - "stream_id"
            - "task_id"
          phase_2_must_when_complete:
            - "stream_id"
            - "task_id"
            - "tests_run (ou tests_run=SKIP(<raison>))"
            - "cmd (ou cmd=SKIP(<raison>))"
        SHOULD_by_task_update:
          claim:
            - "stream_id=<stream>"
            - "task_id=<task>"
          complete:
            - "stream_id=<stream>"
            - "task_id=<task>"
            - "<role>_artifact=<path_or_proof>"
            - "tests_run=<gate:test|...>"
            - "cmd=<commande_executee_via_exec_safe>"
          handoff:
            - "handoff_id=<id>"
            - "to_role=<role>"
            - "task_id=<task>"
          blocked:
            - "blocker_id=<id>"
            - "owner_role=<role>"
            - "eta_utc=<datetime>"
        reference_doc: "docs/ops/ROLE_CONTRACT_EVIDENCE_SCHEMA.md"
      BLOCKER_ID:
        examples:
          - "NONE"
          - "RUN_LOCK_BUSY"
          - "NO_PROGRESS_STREAK"
      NEXT_ACTION_UNIQUE:
        rule: "action unique deterministe, non vide"
        SHOULD_include_one_of:
          - "stream_id"
          - "task_id"
          - "handoff_id"
        examples:
          - "TASK_<task_id>_<action>_<epoch>"
          - "STREAM_<stream_id>_<action>_<epoch>"
          - "HANDOFF_<handoff_id>_<action>_<epoch>"

  admin_signal_contract:
    source: "admin-agents-supervisor-15m"
    fields_required:
      - "status"
      - "deterministic_issue"
      - "action_id"
      - "action_owner"
      - "action_scope"
      - "next_action"
      - "artifact"
    owner_routing_rules:
      - case: "action_owner=adminapp-codex"
        action: "auto_execute_if_enabled"
      - case: "action_owner in [admin-agents, clawsentinel]"
        action: "route_handoff_to_admin_chat_no_fake_blocked"

coordination_and_ordination:
  dependency_graph_template:
    stream_steps:
      - code: "PLAN"
        role: "planner"
        depends_on: []
      - code: "ANALYSIS"
        role: "analyst"
        depends_on: ["PLAN"]
      - code: "ARCH"
        role: "architect"
        depends_on: ["ANALYSIS"]
      - code: "QA_PREP"
        role: "qa"
        depends_on: ["PLAN"]
      - code: "TEST_PLAN"
        role: "tester"
        depends_on: ["PLAN"]
      - code: "DATA"
        role: "data_analyst"
        depends_on: ["ANALYSIS"]
      - code: "INFRA"
        role: "infra_engineer"
        depends_on: ["ARCH"]
      - code: "BACKEND"
        role: "backend_engineer"
        depends_on: ["ARCH"]
      - code: "FRONTEND"
        role: "frontend_engineer"
        depends_on: ["ARCH"]
      - code: "INTEGRATION"
        role: "integrator"
        depends_on: ["BACKEND", "FRONTEND", "INFRA", "DATA"]
      - code: "QA_EXEC"
        role: "qa"
        depends_on: ["INTEGRATION", "QA_PREP", "TEST_PLAN"]
      - code: "SENTINEL_CHECK"
        role: "clawsentinel"
        depends_on: ["QA_EXEC"]
      - code: "SCRUM_REVIEW"
        role: "scrum_master"
        depends_on: ["PLAN"]
      - code: "PO_REVIEW"
        role: "po"
        depends_on: ["QA_EXEC", "SENTINEL_CHECK"]

  task_state_machine:
    states: ["BACKLOG", "WAITING_DEP", "READY", "IN_PROGRESS", "REVIEW", "DONE", "BLOCKED"]
    transitions:
      - from: "BACKLOG"
        to: "READY"
        condition: "deps_done"
      - from: "WAITING_DEP"
        to: "READY"
        condition: "deps_done"
      - from: "READY"
        to: "IN_PROGRESS"
        condition: "claim_success + wip_limit_not_reached"
      - from: "IN_PROGRESS"
        to: "DONE"
        condition: "complete_success + evidence_attached"
      - from: "IN_PROGRESS"
        to: "BLOCKED"
        condition: "block(reason)"
      - from: "BLOCKED"
        to: "WAITING_DEP"
        condition: "unblock"

  handoff_policy:
    MUST:
      - "complete --handoff-to ouvre un handoff OPEN"
      - "le receveur ACK uniquement si role==to_role"
      - "handoff CLOSE uniquement apres prise en charge effective"
    commands:
      claim: "scripts/parallel_workstream.py claim --role <role>"
      complete: "scripts/parallel_workstream.py complete --role <role> --task <id> --artifact <proof> --handoff-to <next_role>"
      ack: "scripts/parallel_workstream.py handoff-ack --handoff <id> --role <receiver>"
      close: "scripts/parallel_workstream.py handoff-close --handoff <id> --role <receiver>"

  coordination_invariants:
    - id: "INV-READY-SYNC"
      severity: "WARN"
      rule: "workboard ne doit pas contenir de tasks READY si la priority queue n'a aucun item READY (eviter la derive queue/workboard)"
      detection: "python3 scripts/parallel_workstream.py validate + compare priority-queue.json"
      owner: "scrum_master"
      remediation:
        - "scripts/parallel_workstream.py sync-priority"
        - "corriger source-of-truth (priority queue) puis revalider"
    - id: "INV-DONE-PROOF"
      severity: "BLOCKED"
      rule: "task DONE doit avoir au moins 1 artifact path existant + evidence testable (ou SKIP motive)"
      detection: "evidence_governance.proof_manifest_validation + validation lane signoff"
      owner: "qa"
      remediation:
        - "reclasser DONE -> REVIEW si preuve absente"
        - "assign corrective action au role producteur"
    - id: "INV-HANDOFF-SLA"
      severity: "WARN->BLOCKED"
      rule: "OPEN handoffs doivent etre ACK < 900s et CLOSE < 3600s"
      detection: "workboard + handoff_policy + KPI-HANDOFF-ACK-SLA"
      owner: "scrum_master"
      remediation:
        - "de-bottleneck via reassignment/WIP reduction"
        - "escalation admin-agents si repetition >=2 ticks"
    - id: "INV-INPROGRESS-STALE"
      severity: "WARN"
      rule: "une task IN_PROGRESS ne doit pas rester sans progression au-dela du SLA stale (default 4h)"
      detection: "python3 scripts/parallel_workstream.py validate --in-progress-stale-seconds <sec>"
      owner: "scrum_master"
      remediation:
        - "reclaim_or_close de la task stale"
        - "si cause technique: blocker explicite sur la task (raison verifiable)"
    - id: "INV-QUEUE-CLOSED-WITH-OPEN-TASKS"
      severity: "WARN"
      rule: "un stream marque PASS/CLOSED dans la queue ne doit plus avoir de tasks READY/IN_PROGRESS/REVIEW/BLOCKED dans le workboard"
      detection: "python3 scripts/parallel_workstream.py validate"
      owner: "scrum_master"
      remediation:
        - "reopen le stream dans priority-queue si du travail reste a livrer"
        - "sinon cloturer/archiver les tasks restantes du workboard"

conflict_prevention:
  locking_mechanisms:
    role_run_lock:
      file_pattern: "/home/venom/.openclaw/cron/role-state/<role>.run.lock"
      behavior_on_conflict: "emit RUN_LOCK_BUSY contract; no overlapping execution"
    workboard_lock:
      file: "docs/orchestrator-ops/parallel-workstreams.json.lock"
      mechanism: "fcntl LOCK_EX"
    cron_admin_lock:
      script: "scripts/cron_admin_lock.sh"
      scope: "cron edit/add/disable/enable operations"

  queue_first_delivery_gate:
    rule:
      MUST: "roles editables restent en read-only quand queue_has_ready=0 ET workboard_role_has_in_progress=0"
      MUST_override: "si workboard_role_has_in_progress=1, la reprise delivery est autorisee pour fermer/mettre a jour la task en cours"
      MAY_override: "TMUX_ROLE_ALLOW_WORKBOARD_ONLY_DELIVERY=1 pour mode exceptionnel"
    objective: "eviter le codage hors priorites et les sorties fictives"

  stale_running_autoheal:
    detector_script: "scripts/stale_cron_sweep.sh"
    tick_wrapper: "scripts/stale_cron_tick.sh"
    utility_cron: "stale-sweep-autoheal-7m"
    stale_definition:
      - "runningAtMs age > threshold"
      - "aucun process cron_tmux_role_runner.sh <role> vivant"
    remediation: "disable/enable job cible"

proofs_of_delivery:
  objective: "rendre chaque livraison verifiable, attribuable, et auditable"

  proof_levels:
    role_run_level:
      source: "/home/venom/.openclaw/cron/role-state/<role>.last_contract"
      MUST_include:
        - "8-key role contract"
        - "task_update"
        - "artifact marker role-specific"
    task_level:
      source: "docs/orchestrator-ops/parallel-workstreams.json"
      MUST_include:
        - "task state transitions"
        - "assignee"
        - "artifact paths"
        - "handoff records"
    stream_level:
      source: "parallel-workstreams.json + priority-queue.json"
      MUST_include:
        - "stream state"
        - "dependency completion"
        - "qa/gate alignment"
    admin_level:
      source: "ADMIN_TEAM_CHAT.md + ADMIN_TEAM_ITERATIONS.md"
      MUST_include:
        - "intent"
        - "decision"
        - "owner"
        - "next action"

  role_artifact_markers:
    planner: "PLANNER_ARTIFACT="
    analyst: "ANALYST_ARTIFACT="
    architect: "ARCHITECT_ARTIFACT="
    backend_engineer: "BACKEND_ARTIFACT="
    frontend_engineer: "FRONTEND_ARTIFACT="
    data_analyst: "DATA_ARTIFACT="
    infra_engineer: "INFRA_ARTIFACT="
    integrator: "INTEGRATOR_ARTIFACT="
    dev: "DEV_ARTIFACT="
    tester: "TESTER_ARTIFACT="
    qa: "QA_ARTIFACT="
    po: "PO_ARTIFACT="
    scrum_master: "SCRUM_ARTIFACT="
    clawsentinel: "SENTINEL_ARTIFACT="

  proposed_delivery_proof_manifest_schema:
    description: "spec vnext pour unifier la preuve de livraison par iteration"
    file_pattern: "docs/orchestrator-ops/proofs/<stream_id>/<task_id>/<timestamp>.yaml"
    schema:
      proof_id: "string"
      stream_id: "string"
      task_id: "string"
      role: "string"
      produced_at_utc: "datetime"
      inputs:
        queue_snapshot_ref: "path"
        workboard_snapshot_ref: "path"
        prior_contract_ref: "path"
      execution:
        commands:
          - cmd: "string"
            rc: "integer"
            started_at_utc: "datetime"
            ended_at_utc: "datetime"
        code_changes:
          - file: "path"
            summary: "string"
      validations:
        tests:
          - name: "string"
            result: "PASS|FAIL|SKIP"
            evidence: "path_or_inline"
      outputs:
        role_contract_ref: "path"
        artifacts:
          - "path"
      handoff:
        to_role: "string"
        handoff_id: "string"
      signoff:
        producer_agent: "string"
        reviewer_agent: "string"
        qa_verdict: "PASS|GO_WITH_CAUTION|BLOCKED"

delivery_quality_gates:
  objective: "augmenter la qualite des livraisons via gates simples, reproductibles et tracables"
  gates:
    - id: "GATE-00-TOOLING-READINESS"
      MUST: "le preflight outillage dev/qa doit etre PASS avant scale-up parallel ou QA finale"
      command: "bash scripts/dev_qa_tooling_check.sh"
      evidence_hint: "tooling_check=PASS; tooling_ref=<run_or_log_ref>"
    - id: "GATE-01-COMMAND-SAFETY"
      MUST: "toute commande shell executee pour livraison doit passer par scripts/exec_safe.sh"
      implementation_ref: "scripts/exec_safe.sh + scripts/command_safety_gate.py"
    - id: "GATE-02-TARGETED-TESTS"
      MUST: "toute completion (task_update=complete) doit citer des tests/cmd reelles ou SKIP motive"
      examples:
        - "backend: bash scripts/backend_regression_gate.sh --no-live"
        - "preflight: bash scripts/preflight_dispatch.sh"
    - id: "GATE-03-INDEPENDENT-REVIEW"
      MUST: "review independante tracee en contrat machine-readable"
      evidence_hint: "review_ref=<path_or_run_id>; review_verdict=<GO|BLOCKED|PASS>"
    - id: "GATE-04-DELIVERY-ARTIFACT-GATE"
      MUST: "avant PASS final (QA/PO), executer le gate artifact scripts/run_delivery_gate.sh"
      command: "bash scripts/run_delivery_gate.sh <artifact_path>"
  artifact_conventions:
    batch_gate_artifact:
      pattern: "finance-app/openclaw-gates/batch-<id>-<timestamp>.md"
      required_sections:
        - "DELTA"
        - "EVIDENCE"
        - "RISKS"
        - "NEXT"
        - "VERDICT"
        - "BLOCKER_ID"
        - "NEXT_ACTION_UNIQUE"
  enforcement_rollout:
    phase_1: "documenter schema evidence + encourager citation cmd/tests (SHOULD)"
    phase_2: "rendre cmd/tests/proof obligatoires sur task_update=complete (MUST)"

enforcement_and_escalation:
  objective: "definir des triggers deterministes pour convertir les sorties en actions (WARN/BLOCKED) et eviter les DONE fictifs"

  enforcement_phases:
    - phase: "PHASE-1-SOFT"
      status: "active"
      description: "enforcement minimal + correction par QA/owners, sans casser la cadence"
      default_severity: "WARN"
      MUST_enforce:
        - "contrat 8 cles + ordre"
        - "EVIDENCE contient task_update + lock_check + role artifact marker"
        - "queue_first_delivery_gate (pas de write si queue_has_ready=0)"
      SHOULD_enforce:
        - "stream_id + task_id dans EVIDENCE quand workboard/queue a du travail"
        - "cmd/tests_run cites pour task_update=complete"

    - phase: "PHASE-2-HARD"
      status: "planned"
      description: "enforcement strict sur complete: cmd/tests/proofs obligatoires, DONE->REVIEW automatique"
      default_severity: "BLOCKED"
      MUST_enforce:
        - "task_update=complete => stream_id + task_id + <role>_artifact + cmd/tests_run (ou SKIP motive) obligatoires"
        - "artefact path doit exister au moment du DONE"
        - "delivery artifact gate obligatoire avant PASS final QA/PO"

  state_corrections:
    - id: "CORR-001-DONE-WITHOUT-PROOF"
      from_state: "DONE"
      to_state: "REVIEW"
      severity: "BLOCKED"
      reason: "preuve manquante ou non verifiable (artefact absent / cmd/tests_run manquants)"
      owner: "qa"
      action:
        - "reclasser la task DONE -> REVIEW"
        - "ouvrir blocker explicite + assign au role producteur"
    - id: "CORR-002-QUEUE-WORKBOARD-DRIFT"
      from_state: "*"
      to_state: "*"
      severity: "WARN"
      reason: "workboard READY alors que queue_has_ready=0 (derive source-of-truth)"
      owner: "scrum_master"
      action:
        - "scripts/parallel_workstream.py sync-priority"
        - "corriger la priority queue si necessaire"

  enforcement_triggers:
    - id: "ENF-TRG-001-COMPLETE-MISSING-CMD-TESTS"
      when: "role contract has task_update=complete but missing cmd/tests_run keys (or SKIP motive)"
      severity_phase_1: "WARN"
      severity_phase_2: "BLOCKED"
      owner: "qa"
      remediation:
        - "demander re-run du role producteur avec cmd/tests_run verifiables"
        - "si task deja DONE: appliquer CORR-001"
    - id: "ENF-TRG-002-ARTEFACT-PATH-NOT-FOUND"
      when: "EVIDENCE cite <role>_artifact=<path> mais le path n'existe pas"
      severity: "BLOCKED"
      owner: "qa"
      remediation:
        - "corriger evidence (path correct) ou regenerer l'artefact"
        - "si task DONE: DONE->REVIEW"
    - id: "ENF-TRG-003-READY-NO-DELTA"
      when: "queue_has_ready=1 et un role editable retourne DELTA=NO_DELTA"
      severity: "BLOCKED"
      owner: "admin-agents"
      remediation:
        - "forcer un claim (workboard) ou rerouter vers role capable"
        - "si repetition >=2 ticks: reduire WIP ou changer owner"
    - id: "ENF-TRG-004-HANDOFF-SLA-BREACH"
      when: "handoff OPEN sans ACK > 900s ou sans CLOSE > 3600s"
      severity: "WARN->BLOCKED"
      owner: "scrum_master"
      remediation:
        - "reassign workload / reduire WIP"
        - "escalation admin-agents si repetition >=2 ticks"

  escalation_path:
    - rule: "role-level quality/proof issues => qa owns"
    - rule: "flow/WIP/handoff congestion => scrum_master owns (escalate admin-agents if stuck)"
    - rule: "runtime cron/tmux/locks => adminapp-codex owns"
    - rule: "safety/anti-drift => clawsentinel owns"

communication_model:
  channels:
    runtime_machine_channels:
      - "role-state/*.last_contract"
      - "parallel-workstreams.json (tasks/handoffs/events)"
      - "priority-queue.json"
    admin_governance_channels:
      - "docs/ops/ADMIN_TEAM_CHAT.md"
      - "docs/ops/ADMIN_TEAM_ITERATIONS.md"
    observability_channels:
      - "logs-codex-runs/role-runner/<role>.live.log"
      - "logs-codex-runs/tmux-live/<session>.log"

  anti_conflict_comm_rules:
    MUST:
      - "tout signal admin doit porter action_id + action_owner + action_scope"
      - "pas d'execution d'action externe si action_owner n'est pas local"
      - "dedupe des handoffs admin par action_id"
      - "pas de faux BLOCKED si no-ready queue + issue benigne"

admin_control_plane:
  admin_agents_supervisor:
    loop_type: "deterministic tick"
    computes:
      - "role_jobs health"
      - "session presence/idle/stale trace"
      - "stale running jobs"
      - "top_issue + next_action + owner"
    output_contract:
      - "status"
      - "deterministic_issue"
      - "action_id"
      - "action_owner"
      - "action_scope"
      - "next_action"

  adminapp_codex_sync:
    loop_type: "runtime monitor + auto-exec"
    behavior:
      - "parse latest admin-agents summary"
      - "execute local owner actions with cooldown policy"
      - "route external-owner actions to admin chat"
      - "auto-heal stale running proactively"
    safety:
      - "cooldown exemptions uniquement pour stale reset"
      - "repeat stall escalation >=2 ticks si action non done"

observability_and_slos:
  live_monitoring:
    manual_follow_cmd: "bash scripts/tmux_codex_live_monitor.sh --mode follow --engine capture --include-admin"
    watchdog_cmds:
      start: "bash scripts/tmux_live_watchdog.sh start"
      status: "bash scripts/tmux_live_watchdog.sh status"
      stop: "bash scripts/tmux_live_watchdog.sh stop"
    logs:
      session_logs: "logs-codex-runs/tmux-live/"
      role_traces: "logs-codex-runs/role-runner/"

  health_metrics:
    cron_health_summary:
      formula: "total, ok, blocked_signals, slow_over_180s"
      target:
        ok_rate_min: 1.0
        blocked_signals_max: 0
        slow_over_180s_max: 0
    role_productivity_metrics:
      - name: "no_delta_rate_when_queue_ready"
        target_max: 0.1
      - name: "handoff_ack_latency_seconds"
        target_max: 900
      - name: "reopened_blocked_tasks_rate"
        target_max: 0.15

  alert_thresholds:
    - id: "ALERT-CRON-ERROR-3"
      condition: "error_jobs >= 3"
      verdict: "BLOCKED"
      immediate_action: "admin intervention lock+backup+fix+validation"
    - id: "ALERT-STALE-RUNNING-3"
      condition: "stale_running_jobs >= 3"
      verdict: "BLOCKED"
      immediate_action: "batch stale reset + probe planner/backend/frontend"
    - id: "ALERT-ADMIN-ACTION-STALLED"
      condition: "same admin action repeated >=2 ticks and not done"
      verdict: "BLOCKED"
      immediate_action: "manual escalation"

change_management:
  non_destructive_edit_protocol:
    MUST_steps:
      - "declare INTENT in ADMIN_TEAM_CHAT"
      - "backup runtime files"
      - "minimal change set"
      - "force-run validation"
      - "journal DONE in chat + iterations + memory"

  rollback_strategy:
    cron_jobs: "restore from /home/venom/.openclaw/cron/backups"
    config: "restore previous script defaults + reprovision --apply --enable"
    sessions: "set_orchestration_mode --mode paused --stop-sessions then controlled re-enable"

specs_vnext_proposals:
  - id: "SPEC-VNEXT-001-PROOF-MANIFEST"
    priority: "P0"
    goal: "introduire un manifeste YAML de preuve par task"
    outcome:
      - "audit trail complet input->action->validation->handoff"
      - "qualite de preuve homogenisee"
    acceptance:
      - "100% des tasks DONE ont un manifest valide"

  - id: "SPEC-VNEXT-002-HANDOFF-SLA"
    priority: "P0"
    goal: "SLA explicite sur ACK/CLOSE de handoffs"
    policy:
      ack_deadline_seconds: 900
      close_deadline_seconds: 3600
      escalation_owner: "scrum_master"
    acceptance:
      - "open_handoffs older than ack_deadline == 0"

  - id: "SPEC-VNEXT-003-DEPENDENCY-GUARD"
    priority: "P0"
    goal: "interdire complete d'une task si dependances critiques invalidees"
    mechanism:
      - "recompute dependency graph before each complete"
      - "hard fail on missing dependency DONE"

  - id: "SPEC-VNEXT-004-ITERATION-DELIVERY-PACKET"
    priority: "P1"
    goal: "packet YAML unique par iteration scrum"
    schema:
      iteration_id: "string"
      streams_covered:
        - "stream_id"
      delivered_tasks:
        - task_id: "string"
          proof_manifest: "path"
          qa_status: "PASS|GO_WITH_CAUTION|BLOCKED"
      unresolved_blockers:
        - blocker_id: "string"
          owner: "role"
          eta_utc: "datetime"

  - id: "SPEC-VNEXT-005-CROSS-ROLE-COMMAND-BUS"
    priority: "P1"
    goal: "bus YAML deterministic pour messages inter-roles sans parser les logs"
    file: "docs/orchestrator-ops/coordination-bus.yaml"
    message_schema:
      msg_id: "string"
      from_role: "string"
      to_role: "string"
      type: "INFO|REQUEST|BLOCKER|HANDOFF|DECISION"
      payload_ref: "path"
      created_at_utc: "datetime"
      ack_required: "boolean"
      ack_deadline_utc: "datetime"

validation_and_compliance:
  mandatory_checks:
    - name: "plumbing_validation"
      command: "bash scripts/validate_parallel_plumbing.sh"
      expected: "failed=0"
    - name: "stale_dry_run"
      command: "bash scripts/stale_cron_sweep.sh --dry-run --threshold 330"
      expected: "stale=0"
    - name: "cron_health"
      command: "openclaw cron list + openclaw cron runs"
      expected: "total=17 ok=17 blocked_signals=0 slow_over_180s=0"
    - name: "watchdog_alive"
      command: "bash scripts/tmux_live_watchdog.sh status"
      expected: "status=yes"
    - name: "circuit_breaker_dry_run"
      command: "bash scripts/orchestration_circuit_breaker.sh --error-threshold 3"
      expected: "status=PASS ou status=TRIGGERED (selon etat runtime)"
    - name: "kpi_export_dry_run"
      command: "bash scripts/export_orchestration_kpi.sh --dry-run"
      expected: "json valide + KPI_EXPORT status=PASS"

  compliance_rules:
    - "Aucun role editable ne doit livrer en mode write si queue_has_ready=0 (sauf override explicite)."
    - "Chaque run role doit finir avec un contrat 8 cles persisté."
    - "Chaque action admin remontee doit avoir action_id + owner + scope explicites."
    - "Tout stale running detecte doit etre traite par stale sweep."

organizational_model:
  objective: "aligner les roles comme une equipe IT reelle travaillant en parallele"
  lane_raci:
    analysis_lane:
      roles: ["planner", "analyst", "architect"]
      accountable: "planner"
      consulted: ["po", "scrum_master", "clawsentinel"]
      expected_outputs:
        - "scope clair par stream"
        - "contrats de dependance explicitement declares"
        - "definition of done par tache"
    build_lane:
      roles: ["backend_engineer", "frontend_engineer", "data_analyst", "infra_engineer", "dev"]
      accountable: "integrator"
      consulted: ["architect", "tester", "qa"]
      expected_outputs:
        - "increment implementable et integre"
        - "evidence de tests ciblés"
        - "handoff propre vers validation"
    integration_lane:
      roles: ["integrator"]
      accountable: "integrator"
      consulted: ["backend_engineer", "frontend_engineer", "infra_engineer", "data_analyst", "tester", "qa"]
      expected_outputs:
        - "integration stable (interfaces compatibles, conflits resolus)"
        - "preuve preflight/smoke (ou SKIP motive)"
        - "handoff vers validation avec artefact unique"
    validation_lane:
      roles: ["tester", "qa", "clawsentinel"]
      accountable: "qa"
      consulted: ["po", "scrum_master"]
      expected_outputs:
        - "rapport validation reproductible"
        - "verdict binaire PASS/BLOCKED avec preuves"
        - "risques residuels explicites"
    governance_lane:
      roles: ["po", "scrum_master", "admin-agents", "adminapp-codex"]
      accountable: "scrum_master"
      consulted: ["planner", "integrator", "qa"]
      expected_outputs:
        - "priorites stables"
        - "arbitrages documentes"
        - "cadence iterations tenue"

  definitions_of_done:
    objective: "eviter les DONE fictifs et standardiser la preuve par lane et type de tache"

    shared:
      MUST:
        - "Tout output role respecte le contrat 8 cles."
        - "Pour task_update=complete: EVIDENCE inclut stream_id, task_id, <role>_artifact, et (cmd/tests_run) ou SKIP motive."
        - "Tout chemin d'artefact cite doit exister au moment du DONE (sinon DONE->REVIEW)."
        - "Si la completion implique un transfert de responsabilite, ouvrir un handoff OPEN (complete --handoff-to) vers le role suivant."
      SHOULD:
        - "Referencer une review independante pour tout changement non trivial (review_ref=...)."
        - "Limiter le texte narratif: privilegier kv (EVIDENCE schema)."

    build_lane:
      applies_to_roles: ["backend_engineer", "frontend_engineer", "data_analyst", "infra_engineer", "dev"]
      task_types:
        backend:
          MUST:
            - "artefact: au moins un fichier modifie sous copilot-app/backend/ (backend_artifact=...)."
            - "tests: au moins un run reproductible (tests_run=...) ou tests_run=SKIP(<raison>)."
            - "cmd: commande via scripts/exec_safe.sh (cmd=...) ou cmd=SKIP(<raison>)."
          RECOMMENDED_tests:
            - "bash scripts/backend_regression_gate.sh --no-live"
        frontend:
          MUST:
            - "artefact: au moins un fichier modifie sous finance-app/ (frontend_artifact=...)."
            - "tests: au moins une verification reproductible (tests_run=...) ou SKIP motive."
            - "cmd: commande via scripts/exec_safe.sh (cmd=...) ou cmd=SKIP(<raison>)."
        data:
          MUST:
            - "artefact: modele/query/metric modifie (data_artifact=...)."
            - "qualite: citer au moins un check (tests_run=data_quality:<PASS|SKIP>)."
        infra:
          MUST:
            - "artefact: config/runtime/ops modifie (infra_artifact=...)."
            - "validation: citer un check operationnel (tests_run=plumbing|cron|health...)."
        dev_generalist:
          MUST:
            - "artefact: patch concret (dev_artifact=...)."
            - "validation: citer test ou check minimal (tests_run=...)."

    integration_lane:
      applies_to_roles: ["integrator"]
      MUST:
        - "assembler les livrables build en une sortie coherent (integrator_artifact=...)."
        - "executer un preflight/smoke ou SKIP motive (cmd=...;tests_run=...)."
        - "ouvrir un handoff unique vers validation (to_role=tester|qa) avec handoff_id cite."
      RECOMMENDED_commands:
        - "bash scripts/preflight_dispatch.sh"

    validation_lane:
      applies_to_roles: ["tester", "qa", "clawsentinel"]
      tester:
        MUST:
          - "executer des tests reproductibles ou SKIP motive (tests_run=...)."
          - "produire un artefact test (tester_artifact=...) et lier les defects a task_id/stream_id."
      qa:
        MUST:
          - "verifier coherence queue/workboard/gates et donner un verdict clair."
          - "si verdict PASS: citer l'artefact gate (qa_artifact=finance-app/openclaw-gates/...) et un delivery gate (cmd=bash scripts/run_delivery_gate.sh ...)."
      clawsentinel:
        MUST:
          - "emettre un signal anti-derive exploitable (sentinel_artifact=...) avec owner explicite."

  role_charters:
    planner:
      mission: "mentor de conformite vision: verifier que le travail READY/IN_PROGRESS respecte la vision produit"
      entry_criteria:
        - "priority queue disponible"
        - "vision produit explicite disponible (PRODUCT_VISION + epics/tasks)"
      exit_criteria:
        - "au moins un verdict de conformite task-level publie avec regle verifiee"
        - "si non-conformite: correction unique proposee et owner cible"
    analyst:
      mission: "clarifier exigences fonctionnelles et donnees"
      entry_criteria:
        - "stream PLAN disponible"
      exit_criteria:
        - "acceptance criteria testables publies"
    architect:
      mission: "securiser architecture et contrats d'integration"
      entry_criteria:
        - "analyse et context runtime disponibles"
      exit_criteria:
        - "contraintes techniques et interfaces versionnees"
    backend_engineer:
      mission: "implementer services/back-end et contrats API"
      entry_criteria:
        - "task READY backend"
      exit_criteria:
        - "code + tests unitaires + artifact backend"
    frontend_engineer:
      mission: "implementer UI/UX et integration API frontend"
      entry_criteria:
        - "task READY frontend"
      exit_criteria:
        - "code + tests UI + artifact frontend"
    data_analyst:
      mission: "gerer qualite donnees, modeles de transformation, KPI"
      entry_criteria:
        - "task READY data"
      exit_criteria:
        - "artifact data + checks qualite"
    infra_engineer:
      mission: "stabiliser execution/runtime/deploiement"
      entry_criteria:
        - "task READY infra"
      exit_criteria:
        - "artifact infra + checks operational"
    integrator:
      mission: "assembler livrables multi-devs et resoudre conflits"
      entry_criteria:
        - "au moins un handoff build OPEN"
      exit_criteria:
        - "task integration DONE + handoff QA"
    dev:
      mission: "support implementation transverse et dettes critiques"
      entry_criteria:
        - "task READY dev"
      exit_criteria:
        - "artifact dev + evidence execution"
    tester:
      mission: "executer plan de tests et rapporter defects actionnables"
      entry_criteria:
        - "artifact integration ou role build disponible"
      exit_criteria:
        - "evidence tests + defects priorises"
    qa:
      mission: "decider release readiness et coherence des preuves"
      entry_criteria:
        - "evidence tester + integration"
      exit_criteria:
        - "QA verdict explicite + next action unique"
    po:
      mission: "garder alignement business/priorites"
      entry_criteria:
        - "verdict QA disponible"
      exit_criteria:
        - "go/no-go documente sur queue"
    scrum_master:
      mission: "tenir cadence et lever impediments inter-roles"
      entry_criteria:
        - "etat iteration et blockers disponibles"
      exit_criteria:
        - "actions de debottleneck assignées"
    clawsentinel:
      mission: "controler surete/qualite/signal faible"
      entry_criteria:
        - "sorties QA ou anomalies runtime"
      exit_criteria:
        - "signal securite exploitable par owner explicite"
    admin-agents:
      mission: "superviser efficacite delivery et congestion parallelisme"
      entry_criteria:
        - "cron status + workboard et queue disponibles"
      exit_criteria:
        - "action_id owner-routed et deduped"
    adminapp-codex:
      mission: "orchestrer remediation runtime deterministe"
      entry_criteria:
        - "signal admin-agents ou stale detector"
      exit_criteria:
        - "action appliquee ou handoff propre externe owner"

parallel_execution_policy:
  global_limits:
    max_concurrent_role_writes: 6
    max_concurrent_validation_roles: 3
    max_open_handoffs_per_role: 5
    max_blocked_tasks_per_stream_before_escalation: 2
  role_wip_limits_must_match:
    source: "baseline_actuelle.runtime_profile.role_jobs[].wip_limit"
    rule: "le runtime workboard ne doit jamais depasser ce plafond"
  claim_policy:
    MUST:
      - "claim uniquement sur task state READY"
      - "claim refuse si deps non DONE"
      - "claim refuse si role atteint son wip_limit"
    SHOULD:
      - "prioriser le plus vieux READY (FIFO) dans un meme stream"
  work_conservation_policy:
    MUST:
      - "si role n'a pas de READY local, aider sur revue/handoff/backlog grooming"
      - "qa/tester ne doivent pas attendre passivement la fin des devs"
    examples:
      - "qa prepare cas de tests et seuils de validation pendant build lane active"
      - "tester execute smoke sur increments partiels handoffes"

scrum_iteration_model:
  sprint_defaults:
    duration_days: 7
    planning_window_minutes: 45
    daily_sync_window_minutes: 15
    review_window_minutes: 30
    retrospective_window_minutes: 30
  iteration_artifacts_required:
    - "iteration plan yaml"
    - "stream dependency map"
    - "proof manifests per done task"
    - "qa signoff summary"
    - "retro improvements backlog"
  ceremonies_as_events:
    planning:
      trigger: "nouvelle iteration ou scope pivot"
      output: "streams READY + owners + deps + risk budget"
    daily_sync:
      trigger: "chaque jour ouvrable"
      output: "top blockers + owner + ETA"
    review:
      trigger: "fin iteration"
      output: "delivered vs planned with evidence"
    retro:
      trigger: "apres review"
      output: "3 ameliorations max, chacune owner + due date"

evidence_governance:
  retention_policy:
    role_contract_retention_days: 30
    task_proof_manifest_retention_days: 90
    iteration_packet_retention_days: 180
    admin_chat_retention_days: 180
  evidence_quality_rules:
    MUST:
      - "chaque DONE contient au moins 1 artifact path existant"
      - "chaque verdict QA cite evidence testable"
      - "chaque blocker cite owner et ETA"
    MUST_NOT:
      - "evidence vide ou purement narrative sans reference fichier"
      - "commandes non executees presentees comme executees"
  proof_manifest_validation:
    schema_version: "v1"
    required_top_fields:
      - "proof_id"
      - "stream_id"
      - "task_id"
      - "role"
      - "produced_at_utc"
      - "execution"
      - "outputs"
      - "signoff"
    checks:
      - id: "MANIFEST-CHECK-EXISTING-PATHS"
        rule: "tous les refs path doivent exister au moment de la validation"
      - id: "MANIFEST-CHECK-COMMAND-RC"
        rule: "toute commande de validation critique doit avoir rc=0 ou etre marquee SKIP motivee"
      - id: "MANIFEST-CHECK-QA-VERDICT"
        rule: "signoff.qa_verdict doit etre PASS|GO_WITH_CAUTION|BLOCKED"

event_and_message_schemas:
  coordination_bus_file: "docs/orchestrator-ops/coordination-bus.yaml"
  event_types:
    - type: "TASK_CLAIMED"
      producer: "any role"
      required_fields: ["msg_id", "stream_id", "task_id", "from_role", "created_at_utc"]
    - type: "TASK_COMPLETED"
      producer: "any role"
      required_fields: ["msg_id", "stream_id", "task_id", "artifact_ref", "from_role", "created_at_utc"]
    - type: "HANDOFF_OPENED"
      producer: "any role"
      required_fields: ["msg_id", "handoff_id", "from_role", "to_role", "task_id", "ack_required", "ack_deadline_utc"]
    - type: "HANDOFF_ACKED"
      producer: "receiver role"
      required_fields: ["msg_id", "handoff_id", "from_role", "to_role", "created_at_utc"]
    - type: "BLOCKER_RAISED"
      producer: "any role"
      required_fields: ["msg_id", "blocker_id", "owner_role", "severity", "eta_utc"]
    - type: "ADMIN_DECISION"
      producer: "admin-agents|adminapp-codex|clawsentinel"
      required_fields: ["msg_id", "action_id", "action_owner", "decision", "created_at_utc"]
  message_dedupe_policy:
    dedupe_key: "msg_id"
    MUST: "ignorer tout evenement deja traite"
    SHOULD: "journaliser uniquement la premiere occurrence + compteur duplicats"

failure_modes_and_playbooks:
  categories:
    - id: "FM-001"
      title: "role_lock_storm"
      symptom: "RUN_LOCK_BUSY recurrent > threshold"
      detection: "same role lock conflict >=3 ticks consecutifs"
      immediate_actions:
        - "stop session tmux role"
        - "clear stale lock si process absent"
        - "force run probe role"
      owner: "adminapp-codex"
    - id: "FM-002"
      title: "handoff_queue_growth"
      symptom: "open handoffs augmentent sans ack"
      detection: "open_handoffs older than ack_deadline > 0"
      immediate_actions:
        - "scrum_master escalation"
        - "reassign workload or lower WIP"
      owner: "admin-agents"
    - id: "FM-003"
      title: "qa_bottleneck"
      symptom: "tasks REVIEW accumulent"
      detection: "review_queue_size > 5 pendant >2 ticks"
      immediate_actions:
        - "prioriser qa/tester streams critiques"
        - "temporarily pause non critical build tasks"
      owner: "scrum_master"
    - id: "FM-004"
      title: "false_delivery_claim"
      symptom: "contract claims delivery but no artifact/test proof"
      detection: "proof manifest missing required refs"
      immediate_actions:
        - "invalidate DONE -> REVIEW"
        - "assign corrective action to producing role"
      owner: "qa"
    - id: "FM-005"
      title: "runtime_stale_jobs"
      symptom: "runningAtMs active without worker process"
      detection: "stale sweep detects stale>0"
      immediate_actions:
        - "autoheal disable/enable"
        - "targeted probe planner/backend/frontend"
      owner: "adminapp-codex"

kpi_framework:
  delivery_kpis:
    - id: "KPI-THROUGHPUT"
      formula: "count(tasks DONE) per 24h"
      target_min: 8
    - id: "KPI-LEAD-TIME"
      formula: "median(DONE_at - READY_at) in hours"
      target_max: 12
    - id: "KPI-HANDOFF-ACK-SLA"
      formula: "pct(handoffs acked before 900s)"
      target_min: 0.95
    - id: "KPI-REWORK-RATE"
      formula: "pct(tasks moved DONE->IN_PROGRESS)"
      target_max: 0.08
    - id: "KPI-EVIDENCE-COMPLETENESS"
      formula: "pct(DONE tasks with valid proof manifest)"
      target_min: 1.0
  governance_kpis:
    - id: "KPI-ADMIN-ACTION-CYCLE"
      formula: "median(action done_at - action created_at) in minutes"
      target_max: 30
    - id: "KPI-BLOCKER-RESOLUTION"
      formula: "pct(blockers resolved before eta_utc)"
      target_min: 0.85
    - id: "KPI-QUEUE-PRIORITY-COMPLIANCE"
      formula: "pct(deliveries from READY priority items)"
      target_min: 0.95

implementation_rollout_plan:
  phases:
    - phase: "PHASE-1"
      name: "stabilization"
      duration_days: 2
      scope:
        - "enable proof manifest writing for DONE tasks"
        - "enable handoff SLA checks"
        - "enable message bus file with dedupe"
      gate:
        - "no new BLOCKED caused by rollout scripts"
        - "cron health remains >= baseline target"
    - phase: "PHASE-2"
      name: "hard-governance"
      duration_days: 3
      scope:
        - "enforce dependency guard on complete"
        - "enforce evidence quality rules"
        - "activate KPI dashboard export"
      gate:
        - "KPI-EVIDENCE-COMPLETENESS >= 0.95"
        - "open_handoffs older than SLA == 0"
    - phase: "PHASE-3"
      name: "optimization"
      duration_days: 5
      scope:
        - "auto-tune WIP limits by congestion"
        - "introduce predictive blocker alerts"
      gate:
        - "lead time improved >= 20% vs phase-1 baseline"
  rollback_trigger_conditions:
    - "cron error burst >= 3 jobs in same 15m window"
    - "proof manifest validator FAIL rate > 20% for 2 consecutive ticks"
    - "queue priority compliance drops below 80%"
  rollback_actions:
    - "switch mode to admins-only"
    - "disable strict validators just introduced"
    - "restore previous workboard/proof schema snapshots"

