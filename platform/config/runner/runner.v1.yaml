    "scrum_policy": {
      "enabled": 1,
      "ready_starvation_seconds": 1800,
      "stalled_in_progress_seconds": 14400,
      "escalate_after_cycles": 2
    },
    "planner_orchestrator": {
      "enabled": 1,
      "cron_planner_only": 1,
      "max_active": 3,
      "default_ttl_min": 45,
      "retry_max": 2,
      "allow_runtime_explorer": 0,
      "default_helper_mode": "worker_first",
      "backend": "auto",
      "backend_by_role": {
        "admin": "codex_exec",
        "runtime": "codex_exec",
        "dev": "codex_exec",
        "qa": "codex_exec",
        "scrum_master": "codex_exec"
      },
      "managed_roles": ["dev", "admin", "scrum_master"]
    },
    "dynamic_workers": {
      "enabled": 1,
      "max_active": 6,
      "default_ttl_min": 60,
      "retry_max": 2,
      "allowed_roles": ["planner", "dev", "admin"]
    },
    "force_allow_file_edits_all": 1,
    "planner_autonomy": {
      "enabled": 1,
      "wait_forbidden": 1,
      "auto_create_on_empty": 1,
      "create_source": "vision"
