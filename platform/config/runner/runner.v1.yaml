      "enabled": 1,
      "sticky_default": 1,
      "default_ttl_min": 10080,
      "max_active_per_role": 10
    }
  },
  "roles": {
    "planner": {
      "model": "gpt-5.4",
      "thinking": "xhigh",
      "resume": 1,
      "rate_limit_precheck": 1,
      "prompt_timeout_seconds": 300,
      "retry_timeout_seconds": 120,
      "tick_timeout_seconds": 420
    },
    "dev": {
      "model": "gpt-5.4",
      "thinking": "medium",
      "resume": 1,
      "codex_require_fresh_tick": 0,
      "codex_tick_autofix": 1,
      "rate_limit_precheck": 1,
      "prompt_timeout_seconds": 180,
      "retry_timeout_seconds": 90,
      "tick_timeout_seconds": 540
    },
    "admin": {
      "model": "gpt-5.3-codex-spark",
      "thinking": "medium",
      "resume": 1,
      "rate_limit_precheck": 1,
      "prompt_timeout_seconds": 360,
      "retry_timeout_seconds": 150,
      "tick_timeout_seconds": 540
    },
    "scrum_master": {
      "model": "gpt-5.3-codex-spark",
      "thinking": "low",
      "resume": 1,
      "rate_limit_precheck": 1,
