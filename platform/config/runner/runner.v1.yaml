    "scrum_master": {
      "enabled": 1,
      "cron_enabled_profile": "full"
    },
    "state_reconciler": {
      "enabled": 1,
      "stale_lock_seconds": 1800,
      "stale_in_progress_seconds": 14400,
      "ready_starvation_seconds": 1800
