<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Finance Copilot - Daily Brief</title>
  <link rel="stylesheet" href="../platform/design-tokens.css" onerror="this.onerror=null; this.href='/platform/design-tokens.css'">
  <link rel="stylesheet" href="../platform/style.css" onerror="this.onerror=null; this.href='/platform/style.css'">
  <style>
    /* Minimal page-specific styles for personal finance start page */
    .personal-finance-page {
      min-height: 100vh;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.05), rgba(147, 51, 234, 0.05));
      padding: 2rem;
    }

    .pf-header {
      max-width: 1200px;
      margin: 0 auto 2rem;
      text-align: center;
    }

    .pf-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-slate-900, #13343b);
      margin: 0 0 0.5rem 0;
    }

    .pf-subtitle {
      font-size: 1rem;
      color: var(--color-slate-600, #626c71);
      margin: 0;
    }

    .pf-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
    }

    /* Override copilot panel width for full-page view */
    .copilot-panel {
      max-width: 900px;
      width: 100%;
    }

    .back-to-dashboard {
      position: fixed;
      top: 1rem;
      left: 1rem;
      background: var(--color-slate-100, #f0f4f5);
      border: 1px solid var(--color-slate-300, #c9d1d5);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--color-slate-700, #42525a);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .back-to-dashboard:hover {
      background: var(--color-slate-200, #e0e8ea);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <!-- Back to Dashboard Link -->
  <a href="index.html" class="back-to-dashboard">
    ← Back to Dashboard
  </a>

  <!-- Main Page Container -->
  <div class="personal-finance-page">
    <header class="pf-header">
      <h1 class="pf-title">🤖 Your Personal Finance Copilot</h1>
      <p class="pf-subtitle">Start your day with market insights and actionable investment decisions</p>
    </header>

    <main class="pf-content">
      <!-- Copilot Panel Widget Container -->
      <div id="copilot-panel-container">
        <!-- Copilot panel will be loaded here -->
      </div>
    </main>
  </div>

  <script type="module">
    try {
      const { loadComponent } = await import('../platform/js/utils/componentLoader.js');
      window.PlatformComponentLoader = { loadComponent };
    } catch (error) {
      // Optional shared loader is intentionally best-effort to preserve page resilience.
      console.debug('[Personal Finance] Shared component loader unavailable:', error?.message || error);
    }
  </script>

  <!-- Load Copilot Panel Widget -->
  <script>
    /**
     * Personal Finance Start Page
     * BATCH-78-DEV-02: Minimal slice - reuses copilot-panel.html widget
     * Wired to /api/personal-finance/start endpoint via the shared copilot route
     */

    // Override COPILOT_API_BASE to use personal-finance namespace
    window.COPILOT_API_BASE = window.FinanceAPI?.BASE_URL
      || (window.location?.origin ? `${window.location.origin.replace(/\/$/, '')}/api` : 'http://3.98.20.77/api');
    window.COPILOT_NAMESPACE = 'personal-finance';
    const PERSONAL_FINANCE_PENDING_OPEN_KEY = 'financeCopilot.pendingStartOpen';

    function normalizePersonalFinanceStartOpenTarget(target) {
      const normalizedTarget = String(target || '')
        .trim()
        .toLowerCase()
        .replace(/[?#].*$/, '')
        .replace(/\/+$/, '');

      if (!normalizedTarget) {
        return '';
      }

      if (
        normalizedTarget === '/brief/daily'
        || normalizedTarget === 'brief'
        || normalizedTarget === 'brief_of_day'
        || normalizedTarget === 'daily_brief'
      ) {
        return 'market';
      }

      if (
        normalizedTarget === '/copilot'
        || normalizedTarget.startsWith('/copilot/')
        || normalizedTarget === 'copilot'
        || normalizedTarget.startsWith('copilot/')
        || normalizedTarget === '/personal-finance'
        || normalizedTarget.startsWith('/personal-finance/')
        || normalizedTarget === 'personal-finance'
        || normalizedTarget.startsWith('personal-finance/')
      ) {
        return 'copilot';
      }

      if (['market', 'overview', 'calendar', 'opportunities', 'performance', 'ailab'].includes(normalizedTarget)) {
        return normalizedTarget;
      }

      if (normalizedTarget.startsWith('ticker:')) {
        const ticker = normalizedTarget.slice('ticker:'.length).trim().toUpperCase();
        return ticker ? `ticker:${ticker}` : '';
      }

      return '';
    }

    function runCopilotStartOpen(target) {
      const normalizedTarget = normalizePersonalFinanceStartOpenTarget(target);
      if (!normalizedTarget) {
        return false;
      }

      if (normalizedTarget === 'copilot') {
        if (typeof window.focusCopilotInput === 'function') {
          window.focusCopilotInput();
        } else {
          document.getElementById('copilotQuestionInput')?.focus();
        }
        return true;
      }

      try {
        window.sessionStorage?.setItem(PERSONAL_FINANCE_PENDING_OPEN_KEY, normalizedTarget);
      } catch (error) {
        console.debug('[Personal Finance] Pending open target storage unavailable:', error?.message || error);
      }

      if (window.location && typeof window.location.assign === 'function') {
        window.location.assign('index.html');
      } else if (window.location) {
        window.location.href = 'index.html';
      }
      return true;
    }

    window.runCopilotStartOpen = runCopilotStartOpen;

    function cloneInlineScript(script) {
      const nextScript = document.createElement('script');
      for (const attr of script.attributes) {
        nextScript.setAttribute(attr.name, attr.value);
      }
      nextScript.textContent = script.textContent;
      return nextScript;
    }

    function activateInlineScripts(target) {
      const scripts = Array.from(target.querySelectorAll('script'));
      scripts.forEach((script) => {
        const nextScript = cloneInlineScript(script);
        script.parentNode?.replaceChild(nextScript, script);
      });
    }

    function injectWidgetMarkup(container, html) {
      container.innerHTML = html;
      activateInlineScripts(container);
    }

    /**
     * Load copilot panel widget dynamically
     */
    async function loadCopilotWidget() {
      try {
        const container = document.getElementById('copilot-panel-container');
        const panelPath = '../components/widgets/copilot-panel.html';

        if (!container) {
          throw new Error('Copilot panel container not found');
        }

        let loaded = false;

        if (window.PlatformComponentLoader?.loadComponent) {
          loaded = await window.PlatformComponentLoader.loadComponent(panelPath, '#copilot-panel-container');
        } else if (window.ComponentLoader?.loadComponent) {
          loaded = await window.ComponentLoader.loadComponent(panelPath, '#copilot-panel-container');
        }

        if (!loaded) {
          const response = await fetch('../components/widgets/copilot-panel.html');
          if (!response.ok) {
            throw new Error(`Failed to load widget: ${response.status}`);
          }
          const html = await response.text();
          injectWidgetMarkup(container, html);
        }

        if (container) {
          // Override the loadCopilotStart function to use personal-finance endpoint
          window.loadCopilotStart = async function() {
            if (window.copilotState?.isLoading) return;

            window.copilotState.isLoading = true;
            showCopilotLoading(true);

            try {
              // Use personal-finance namespace endpoint
              const response = await fetch(`${window.COPILOT_API_BASE}/personal-finance/start`, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
              });

              if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
              }

              const result = await response.json();
              const data = result.data || result;

              // Apply namespace rewriting to targets
              const rewrittenData = rewriteNamespaceTargets(data, window.COPILOT_NAMESPACE);

              window.copilotState.briefData = rewrittenData;
              window.copilotState.askActions = rewrittenData.ask || [];
              window.copilotState.openActions = rewrittenData.open || [];

              renderCopilotBrief(rewrittenData);
              renderCopilotPortfolio(rewrittenData);
              renderCopilotActions();
              updateCopilotLiveBadge(rewrittenData);

              showCopilotLoading(false);
              showCopilotError(false);

            } catch (error) {
              console.error('Failed to load copilot start:', error);
              showCopilotError(`Failed to load: ${error.message}`);
              showCopilotLoading(false);
            } finally {
              window.copilotState.isLoading = false;
            }
          };

          // Initialize after a short delay to ensure DOM is ready
          setTimeout(() => {
            if (window.initCopilotPanel) {
              window.initCopilotPanel();
            } else if (window.bootstrapCopilotPanel) {
              window.bootstrapCopilotPanel();
            }
          }, 100);
        }
      } catch (error) {
        console.error('Failed to load copilot widget:', error);
        document.getElementById('copilot-panel-container').innerHTML = `
          <div class="copilot-error" style="display: block; padding: 2rem; text-align: center;">
            <span class="error-icon">⚠️</span>
            <p>Failed to load copilot panel. Please refresh the page.</p>
            <button onclick="location.reload()" class="error-retry-btn">Retry</button>
          </div>
        `;
      }
    }

    /**
     * Rewrite namespace targets from /copilot/* to /personal-finance/*
     */
    function rewriteNamespaceTargets(data, namespace) {
      if (!namespace || !data) return data;

      const toNormalizedTarget = (value) => {
        if (!value || typeof value !== 'string') {
          return value;
        }
        return value.trim().replace(/[?#].*$/, '').replace(/\/+$/, '');
      };

      const normalizedNamespace = `/${String(namespace).trim().replace(/^\/+|\/+$/g, '')}`;
      const dedupeNamespaceTarget = (target) => {
        const trimmed = String(target || '').trim();
        const ns = normalizedNamespace || '';
        if (!ns || !trimmed.startsWith(`${ns}/${ns.replace(/^\//, '')}`)) {
          return trimmed;
        }
        return trimmed.replace(`${ns}/${ns.replace(/^\//, '')}/`, `${ns}/`);
      };

      const rewritten = JSON.parse(JSON.stringify(data));

      // Rewrite ask targets
      if (Array.isArray(rewritten.ask)) {
        rewritten.ask = rewritten.ask.map(action => {
          const rawTarget = toNormalizedTarget(action.target);
          if (typeof rawTarget === 'string' && rawTarget.startsWith('/copilot')) {
            const rewrittenTarget = dedupeNamespaceTarget(rawTarget.replace('/copilot', normalizedNamespace));
            return {
              ...action,
              target: rewrittenTarget === `${normalizedNamespace}/${normalizedNamespace.replace(/^\//, '')}`
                ? `${normalizedNamespace}/ask`
                : rewrittenTarget
            };
          }
          return {
            ...action,
            target: rawTarget
          };
        });
      }

      // Rewrite open targets
      if (Array.isArray(rewritten.open)) {
        rewritten.open = rewritten.open.map(action => {
          const rawTarget = toNormalizedTarget(action.target);
          if (typeof rawTarget === 'string' && rawTarget.startsWith('/copilot')) {
            const rewrittenTarget = dedupeNamespaceTarget(rawTarget.replace('/copilot', normalizedNamespace));
            return {
              ...action,
              target: rewrittenTarget.startsWith(normalizedNamespace)
                ? `/${namespace}`
                : rewrittenTarget,
            };
          }
          const normalizedTarget = String(rawTarget || '');
          if (normalizedTarget.startsWith(normalizedNamespace)) {
            return {
              ...action,
              target: normalizedNamespace
            };
          }
          return {
            ...action,
            target: rawTarget
          };
        });
      }

      if (rewritten.ranked_action && typeof rewritten.ranked_action === 'object') {
        const rankedAction = { ...rewritten.ranked_action };
        const rawTarget = toNormalizedTarget(rankedAction.target);
        if (typeof rawTarget === 'string' && rawTarget.startsWith('/copilot')) {
          const rewrittenTarget = dedupeNamespaceTarget(rawTarget.replace('/copilot', normalizedNamespace));
          rankedAction.target = rankedAction.kind === 'ask'
            ? (rewrittenTarget === `${normalizedNamespace}/${normalizedNamespace.replace(/^\//, '')}`
              ? `${normalizedNamespace}/ask`
              : rewrittenTarget)
            : (rewrittenTarget.startsWith(normalizedNamespace) ? normalizedNamespace : rewrittenTarget);
        } else if (typeof rawTarget === 'string' && rawTarget.startsWith(normalizedNamespace)) {
          rankedAction.target = rankedAction.kind === 'ask' ? rawTarget : normalizedNamespace;
        } else {
          rankedAction.target = rawTarget;
        }
        rewritten.ranked_action = rankedAction;
      }

      return rewritten;
    }

    // Load widget when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadCopilotWidget);
    } else {
      loadCopilotWidget();
    }
  </script>
</body>
</html>
