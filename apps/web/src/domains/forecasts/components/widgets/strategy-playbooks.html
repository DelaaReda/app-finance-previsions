<section class="widget-card strategy-playbooks-widget" aria-label="Strategy Playbooks">
    <div class="widget-header">
        <div class="widget-title-row">
            <span class="widget-icon">📚</span>
            <h2 class="widget-title">Strategy Playbooks</h2>
        </div>
        <div class="widget-actions">
            <button class="help-icon" onclick="showHelp('strategy-playbooks')" aria-label="Help"
                title="AI-generated trading playbooks from Judge verdicts">?</button>
            <button class="menu-icon" onclick="showToast('Widget menu')" aria-label="Menu">⋮</button>
        </div>
    </div>
    <div class="widget-body">
        <p class="widget-subtitle">Actionable trading strategies based on AI analysis</p>
        
        <!-- Filter Bar -->
        <div class="playbooks-filter-bar">
            <select id="playbookProfile" class="playbook-filter-select" onchange="loadStrategyPlaybooks()">
                <option value="equity_1w">Equity 1W</option>
                <option value="equity_1m">Equity 1M</option>
                <option value="crypto_1w">Crypto 1W</option>
                <option value="forex_1d">Forex 1D</option>
            </select>
            <select id="playbookDecision" class="playbook-filter-select" onchange="loadStrategyPlaybooks()">
                <option value="all">All Decisions</option>
                <option value="go">Go (Buy/Long)</option>
                <option value="no_go">No Go (Sell/Short)</option>
                <option value="hold">Hold</option>
            </select>
            <input type="text" id="playbookTickerFilter" class="playbook-search-input" 
                placeholder="Search ticker..." oninput="debounceLoadPlaybooks()" />
        </div>

        <!-- Playbooks List -->
        <div class="playbooks-list" id="playbooksList">
            <!-- Loaded dynamically -->
            <div class="playbook-loading-state">
                <div class="loading-spinner"></div>
                <p>Loading strategy playbooks...</p>
            </div>
        </div>
    </div>
    <div class="widget-footer">
        <span class="widget-timestamp" id="playbooksTimestamp">Updated --</span>
        <button class="widget-action-btn" onclick="loadStrategyPlaybooks()">🔄 Refresh</button>
    </div>
</section>

<style>
    .strategy-playbooks-widget {
        grid-column: span 2;
    }

    .playbooks-filter-bar {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
    }

    .playbook-filter-select,
    .playbook-search-input {
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: var(--color-text);
        font-size: 13px;
        cursor: pointer;
    }

    .playbook-filter-select:focus,
    .playbook-search-input:focus {
        outline: none;
        border-color: var(--color-primary);
    }

    .playbook-search-input {
        flex: 1;
        min-width: 150px;
    }

    .playbooks-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 400px;
        overflow-y: auto;
    }

    .playbook-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 16px;
        transition: all 0.2s ease;
    }

    .playbook-card:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
    }

    .playbook-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }

    .playbook-ticker {
        font-size: 18px;
        font-weight: 700;
        color: var(--color-text);
    }

    .playbook-decision-badge {
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
    }

    .playbook-decision-badge.go {
        background: rgba(52, 211, 153, 0.2);
        color: #34D399;
        border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .playbook-decision-badge.no_go {
        background: rgba(239, 68, 68, 0.2);
        color: #EF4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .playbook-decision-badge.hold {
        background: rgba(251, 191, 36, 0.2);
        color: #FBBF24;
        border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .playbook-metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 12px;
    }

    .playbook-metric {
        text-align: center;
        padding: 8px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 8px;
    }

    .playbook-metric-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--color-text-tertiary);
        margin-bottom: 4px;
    }

    .playbook-metric-value {
        font-size: 16px;
        font-weight: 700;
        color: var(--color-text);
    }

    .playbook-metric-value.positive {
        color: #34D399;
    }

    .playbook-metric-value.negative {
        color: #EF4444;
    }

    .playbook-summary {
        font-size: 13px;
        color: var(--color-text-secondary);
        line-height: 1.5;
        margin-bottom: 12px;
    }

    .playbook-fusion {
        margin-bottom: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(59, 130, 246, 0.08);
        border: 1px solid rgba(96, 165, 250, 0.16);
    }

    .playbook-fusion-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 8px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--color-text-tertiary);
    }

    .playbook-fusion-score {
        color: #93C5FD;
        font-weight: 700;
    }

    .playbook-fusion-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }

    .playbook-fusion-chip {
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        font-size: 11px;
        color: var(--color-text-secondary);
    }

    .playbook-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .playbook-action-tag {
        padding: 4px 10px;
        background: rgba(59, 130, 246, 0.15);
        border: 1px solid rgba(59, 130, 246, 0.3);
        border-radius: 6px;
        font-size: 11px;
        color: #60A5FA;
        font-weight: 500;
    }

    .playbook-loading-state,
    .playbook-empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--color-text-secondary);
    }

    .loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: var(--color-primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .playbook-conflicts {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .playbook-conflict-tag {
        display: inline-block;
        padding: 2px 8px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 4px;
        font-size: 10px;
        color: #F87171;
        margin-right: 6px;
        margin-top: 4px;
    }
</style>

<script>
    // Strategy Playbooks Widget Logic
    let playbooksData = [];
    let playbooksDebounceTimer = null;

    async function loadStrategyPlaybooks() {
        const profile = document.getElementById('playbookProfile')?.value || 'equity_1w';
        const decisionFilter = document.getElementById('playbookDecision')?.value || 'all';
        const tickerFilter = document.getElementById('playbookTickerFilter')?.value || '';
        
        const listEl = document.getElementById('playbooksList');
        const timestampEl = document.getElementById('playbooksTimestamp');
        
        try {
            listEl.innerHTML = `
                <div class="playbook-loading-state">
                    <div class="loading-spinner"></div>
                    <p>Loading strategy playbooks...</p>
                </div>
            `;

            const result = typeof window.getStrategyPlaybooks === 'function'
                ? await window.getStrategyPlaybooks({
                    limit: 20,
                    min_confidence: 0.3,
                    profile,
                    ticker: tickerFilter
                })
                : null;

            if (!result?.data) {
                throw new Error(result?.error || 'Failed to load playbooks');
            }

            playbooksData = result.data.playbooks || [];
            
            // Apply decision filter
            let filtered = playbooksData;
            if (decisionFilter !== 'all') {
                filtered = playbooksData.filter(p => p.decision === decisionFilter);
            }

            // Apply ticker search filter
            if (tickerFilter) {
                const searchLower = tickerFilter.toLowerCase();
                filtered = filtered.filter(p => 
                    (p.ticker || '').toLowerCase().includes(searchLower)
                );
            }

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="playbook-empty-state">
                        <p>No strategy playbooks found</p>
                        <p style="font-size: 12px; margin-top: 8px;">Try adjusting your filters</p>
                    </div>
                `;
            } else {
                listEl.innerHTML = filtered.map(playbook => renderPlaybookCard(playbook)).join('');
            }

            if (timestampEl) {
                const now = new Date();
                timestampEl.textContent = `Updated ${now.toLocaleTimeString()}`;
            }

        } catch (error) {
            console.error('Error loading strategy playbooks:', error);
            listEl.innerHTML = `
                <div class="playbook-empty-state">
                    <p>⚠️ Failed to load playbooks</p>
                    <p style="font-size: 12px; margin-top: 8px;">${error.message}</p>
                    <button onclick="loadStrategyPlaybooks()" class="widget-action-btn" style="margin-top: 12px;">
                        🔄 Retry
                    </button>
                </div>
            `;
        }
    }

    function renderPlaybookCard(playbook) {
        const decisionClass = (playbook.decision || 'hold').toLowerCase();
        const expectedReturn = playbook.expected_return || 0;
        const returnClass = expectedReturn >= 0 ? 'positive' : 'negative';
        const returnSign = expectedReturn >= 0 ? '+' : '';
        const fusionHtml = renderForecastFusion(playbook.forecast_fusion);
        
        const conflictsHtml = (playbook.conflicts || []).length > 0 ? `
            <div class="playbook-conflicts">
                ${(playbook.conflicts || []).map(c => 
                    `<span class="playbook-conflict-tag">${escapeHtml(c)}</span>`
                ).join('')}
            </div>
        ` : '';

        return `
            <div class="playbook-card">
                <div class="playbook-header">
                    <span class="playbook-ticker">${escapeHtml(playbook.ticker || 'UNKNOWN')}</span>
                    <span class="playbook-decision-badge ${decisionClass}">
                        ${escapeHtml(playbook.decision || 'hold')}
                    </span>
                </div>
                
                <div class="playbook-metrics">
                    <div class="playbook-metric">
                        <div class="playbook-metric-label">Confidence</div>
                        <div class="playbook-metric-value">${Math.round((playbook.confidence || 0) * 100)}%</div>
                    </div>
                    <div class="playbook-metric">
                        <div class="playbook-metric-label">Expected Return</div>
                        <div class="playbook-metric-value ${returnClass}">
                            ${returnSign}${Math.round((expectedReturn || 0) * 100)}%
                        </div>
                    </div>
                    <div class="playbook-metric">
                        <div class="playbook-metric-label">Risk Level</div>
                        <div class="playbook-metric-value">${escapeHtml(playbook.risk_level || 'medium')}</div>
                    </div>
                </div>

                ${playbook.summary && playbook.summary.length > 0 ? `
                    <div class="playbook-summary">
                        ${escapeHtml(playbook.summary[0])}
                    </div>
                ` : ''}

                ${fusionHtml}

                ${playbook.recommended_actions && playbook.recommended_actions.length > 0 ? `
                    <div class="playbook-actions">
                        ${playbook.recommended_actions.slice(0, 3).map(action => 
                            `<span class="playbook-action-tag">${escapeHtml(action)}</span>`
                        ).join('')}
                    </div>
                ` : ''}

                ${conflictsHtml}
            </div>
        `;
    }

    function renderForecastFusion(fusion) {
        if (!fusion || typeof fusion !== 'object') {
            return '';
        }

        const attribution = fusion.attribution || {};
        const chips = [
            fusion.dominant_layer ? `Lead: ${formatFusionLabel(fusion.dominant_layer)}` : '',
            attribution.market_regime ? `Regime: ${formatFusionLabel(attribution.market_regime)}` : '',
            typeof attribution.macro_alignment === 'number'
                ? `Macro: ${Math.round(attribution.macro_alignment * 100)}%`
                : ''
        ].filter(Boolean);

        return `
            <div class="playbook-fusion">
                <div class="playbook-fusion-header">
                    <span>Forecast Fusion</span>
                    <span class="playbook-fusion-score">Blend ${formatBlendScore(fusion.blended_score)}</span>
                </div>
                <div class="playbook-fusion-chips">
                    ${chips.map(chip => `<span class="playbook-fusion-chip">${escapeHtml(chip)}</span>`).join('')}
                </div>
            </div>
        `;
    }

    function formatBlendScore(value) {
        if (typeof value !== 'number' || Number.isNaN(value)) {
            return '--';
        }
        return `${Math.round(value * 100)}%`;
    }

    function formatFusionLabel(value) {
        return String(value || '')
            .replace(/_/g, ' ')
            .toLowerCase()
            .replace(/\b\w/g, char => char.toUpperCase());
    }

    function debounceLoadPlaybooks() {
        clearTimeout(playbooksDebounceTimer);
        playbooksDebounceTimer = setTimeout(loadStrategyPlaybooks, 300);
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', () => {
        loadStrategyPlaybooks();
    });
</script>
