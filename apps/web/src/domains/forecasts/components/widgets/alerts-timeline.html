<section class="widget-card alert-timeline" aria-label="Alert timeline">
    <div class="widget-header">
        <div class="widget-title-row">
            <span class="widget-icon">⏰</span>
            <h2 class="widget-title">Recent Signals &amp; Alerts</h2>
        </div>
        <div class="widget-actions">
            <button class="filter-btn active" data-filter="all" onclick="filterAlerts('all')">All</button>
            <button class="filter-btn" data-filter="opportunities" onclick="filterAlerts('opportunities')">Opportunities</button>
            <button class="filter-btn" data-filter="risks" onclick="filterAlerts('risks')">Risks</button>
            <button class="filter-btn" data-filter="news" onclick="filterAlerts('news')">News</button>
            <button class="help-icon" onclick="showHelp('alerts')" aria-label="Help" title="Recent trading signals">?</button>
            <button class="menu-icon" onclick="showToast('Widget menu')" aria-label="Menu">⋮</button>
        </div>
    </div>
    <div class="widget-body">
        <p class="widget-subtitle">Timeline: Last 24 hours</p>
        <div class="timeline-container" id="timelineContainer">
            <div class="alert-item medium expandable" data-priority="low" data-type="news" onclick="toggleAlertDetails(this)">
                <span class="alert-icon">🔎</span>
                <div class="alert-content">
                    <h3>Chargement des alertes...</h3>
                    <p>Connexion aux données live en cours.</p>
                </div>
                <div class="alert-actions" style="display: none;"></div>
            </div>
        </div>
    </div>
    <div class="widget-footer">
        <span class="widget-timestamp">Updated in real-time</span>
    </div>
</section>
