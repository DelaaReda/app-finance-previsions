<section class="widget-card news-impact" aria-label="News impact">
    <div class="widget-header">
        <div class="widget-title-row">
            <span class="widget-icon">📰</span>
            <h2 class="widget-title">News Moving the Market</h2>
        </div>
        <div class="widget-actions">
            <button class="help-icon" onclick="showHelp('news')" aria-label="Help"
                title="News impacting your portfolio">?</button>
            <button class="menu-icon" onclick="showToast('Widget menu')" aria-label="Menu">⋮</button>
        </div>
    </div>
    <div class="widget-body">
        <div class="news-table" id="newsTable"></div>
        <div class="news-horizon-matrix" id="newsImpactHorizonMatrix" hidden></div>
    </div>
    <div class="widget-footer">
        <span class="widget-timestamp" id="newsImpactTimestamp">Updated --</span>
        <button class="widget-action-btn" onclick="showToast('Reading all news...')">Read All News</button>
    </div>
</section>

<script>
async function refreshNewsImpactPlaybooks() {
    const integration = window.PlaybookIntegration;
    const rows = document.querySelectorAll('.news-row[data-ticker]');

    for (const row of rows) {
        const ticker = row.getAttribute('data-ticker');
        const container = document.getElementById('playbook-news-' + ticker);
        if (!ticker || !container) continue;

        if (!integration || typeof integration.getDecisionBadge !== 'function') {
            container.innerHTML = '<span class="playbook-badge badge-neutral">--</span>';
            continue;
        }

        try {
            container.innerHTML = await integration.getDecisionBadge(ticker);
        } catch (error) {
            console.warn('[NewsImpact] Failed to load playbook for ' + ticker + ':', error.message);
            container.innerHTML = '<span class="playbook-badge badge-neutral">--</span>';
        }
    }

    const timestampEl = document.getElementById('newsImpactTimestamp');
    if (timestampEl) {
        timestampEl.textContent = 'Updated ' + new Date().toLocaleTimeString();
    }
}

window.NewsImpactPlaybooks = {
    refresh: refreshNewsImpactPlaybooks
};

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', refreshNewsImpactPlaybooks);
} else {
    refreshNewsImpactPlaybooks();
}
</script>
