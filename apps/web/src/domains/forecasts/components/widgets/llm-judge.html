<section class="widget-card llm-judge-widget" aria-label="LLM Judge">
    <div class="widget-header">
        <div class="widget-title-row">
            <span class="widget-icon">🧠</span>
            <h2 class="widget-title">AI Multi-Model Judge</h2>
        </div>
        <button class="help-icon" onclick="showLLMHelp()" aria-label="Help">?</button>
    </div>
    <div class="widget-body">
        <div class="judge-input-section">
            <input type="text" class="judge-question-input" id="judgeQuestion"
                placeholder="Entrez votre portefeuille (ex: AAPL,MSFT,NVDA)" />
            <button class="ask-judge-btn" id="judgeAskButton" onclick="askLLMJudge()">Analyser maintenant</button>
        </div>
        <div class="judge-status" id="judgeStatus"></div>
        <div class="judge-processing" id="judgeProcessing" style="display: none;">
            <div class="processing-step"><span class="spinner"></span> Préparation de la requête...</div>
            <div class="processing-step"><span class="spinner"></span> Interrogation du Copilot...</div>
            <div class="processing-step"><span class="spinner"></span> Analyse du portefeuille...</div>
            <div class="processing-step"><span class="spinner"></span> Agrégation du consensus...</div>
        </div>
        <div class="judge-result" id="judgeResult" style="display: none;"></div>
        <div id="judgeDecisionJournal" class="judge-decision-journal" style="margin-top: 14px;"></div>
        <button class="ask-another-btn" id="askAnotherBtn" style="display: none;" onclick="resetLLMJudge()">Nouvelle question</button>
    </div>
</section>
