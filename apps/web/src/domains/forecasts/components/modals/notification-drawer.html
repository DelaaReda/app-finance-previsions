<div id="notificationDrawer" class="notification-drawer" role="dialog" aria-label="Notifications">
    <div class="drawer-header">
        <h2>Notifications</h2>
        <button class="close-btn" onclick="closeNotifications()" aria-label="Close">✕</button>
    </div>
    <div class="drawer-content">
        <div class="alert-queue-overview">
            <p id="notificationDrawerSummary" class="widget-subtitle">Top queue: Live queue updating</p>
            <div id="notificationDrawerChips" class="alert-queue-chips">
                <span class="priority-badge high">Urgent 0</span>
                <span class="priority-badge high">Action 0</span>
                <span class="priority-badge medium">Monitor 0</span>
                <span class="priority-badge low">Background 0</span>
            </div>
        </div>
        <div id="notificationDrawerItems">
            <div class="notification-item low read">
                <span class="notif-icon">🔎</span>
                <div class="notif-content">
                    <h3>Alert center syncing</h3>
                    <p>Live alerts are loading into the existing queue.</p>
                    <span class="notif-time">Connecting</span>
                </div>
            </div>
        </div>
    </div>
    <div class="drawer-footer">
        <span id="notificationDrawerMeta" class="widget-timestamp">Alert center synced with the live queue</span>
        <button class="mark-all-btn" onclick="markAllRead()">Mark all as read</button>
    </div>
</div>
