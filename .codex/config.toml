model = "gpt-5.4"
model_reasoning_effort = "high"

[features]
multi_agent = true
apps = true
js_repl = true
prevent_idle_sleep = true

[agents]
max_threads = 4
max_depth = 2

[agents.dev_subagent]
model = "gpt-5.4"
model_reasoning_effort = "high"

[agents.admin_subagent]
model = "gpt-5.4"
model_reasoning_effort = "medium"

[agents.scrum_subagent]
model = "gpt-5.3-codex-spark"
model_reasoning_effort = "low"
